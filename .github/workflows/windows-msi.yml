# Tinta Office: build the Tinta Calculo Windows installer (x64 .msi and portable .zip) on demand.
#
# Unsigned for now: packaging/windows/package.ps1 runs without WINDOWS_CERTIFICATE / AZURE_* secrets,
# so sign.ps1 leaves the files unsigned and Windows SmartScreen warns on first launch ("Windows
# protected your PC" > More info > Run anyway). release.yml (the upstream release pipeline) signs.
# The job also runs the MSI's desktop-shortcut install/repair/upgrade/uninstall test on fixture
# binaries and renders the installer dialogs. Download the .msi/.zip from the run's artifacts.
name: Windows installer

on:
  workflow_dispatch:
  # A test build on PRs that change the Windows packaging.
  pull_request:
    paths: ["packaging/windows/**", "assets/app-icon/**", ".github/workflows/windows-msi.yml"]

permissions:
  contents: read

concurrency:
  group: windows-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi:
    name: Windows x64 .msi
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: tinta-windows-x64
      - name: Install WiX
        shell: pwsh
        # The version package.ps1 documents. gridcraft.wxs uses no WiX extensions (its dialogs
        # are authored in the file), so none are added.
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.dotnet\tools')
      - name: Build the .msi and portable .zip (unsigned)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Desktop shortcut install lifecycle (fixture binaries)
        shell: pwsh
        run: ./packaging/windows/test-desktop-shortcut.ps1
      - name: Render the installer dialogs
        # Native previews need a desktop session; keep the build green if the runner has none.
        continue-on-error: true
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/release/*.msi | Select-Object -First 1).FullName
          ./packaging/windows/preview-installer-dialogs.ps1 -Msi $msi -OutputDir "$env:RUNNER_TEMP\msi-dialogs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tinta-calculo-windows
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tinta-calculo-windows-installer-evidence
          path: |
            ${{ runner.temp }}/msi-dialogs
            ${{ runner.temp }}/tinta-calculo-shortcut-smoke/*.log
          if-no-files-found: ignore
