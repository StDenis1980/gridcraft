[alias]
xtask = "run --package xtask --"

# Tinta Office: this fork's builds are "Tinta Calculo" (see crates/brand). The ArtCraft
# marks may not be used by redistributed builds (docs/brand/LICENSE-brand.txt).
[env]
GRIDCRAFT_BRAND_NAME = "Tinta Calculo"
GRIDCRAFT_BRAND_SLUG = "tinta-calculo"
GRIDCRAFT_BRAND_APP_ID = "io.github.stdenis1980.tintacalculo"
GRIDCRAFT_BRAND_PUBLISHER = "Tinta Office"
GRIDCRAFT_BRAND_WEBSITE = "https://github.com/StDenis1980/gridcraft"
GRIDCRAFT_BRAND_GITHUB = "https://github.com/StDenis1980/gridcraft"
